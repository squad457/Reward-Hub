<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Reward Hub — Loading</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #040907;
    --bg-card: rgba(15, 27, 21, 0.85);
    --emerald: #00F59B;
    --purple: #8B5CF6;
    --gold: #FACC15;
    --ink: #FFFFFF;
    --ink-dim: #9CA3AF;
    --border: rgba(255, 255, 255, 0.08);
    --border-emerald: rgba(0, 245, 155, 0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg-0); color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 30%, rgba(0, 245, 155, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 60%);
  }
  .splash-card {
    position: relative; z-index: 2; width: 90%; max-width: 360px;
    background: var(--bg-card); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 32px;
    padding: 36px 28px; text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 40px rgba(0,245,155,0.15);
  }
  .gem-icon {
    width: 88px; height: 88px; background: linear-gradient(135deg, rgba(0,245,155,0.2), rgba(139,92,246,0.2));
    border: 1.5px solid rgba(0,245,155,0.4); border-radius: 28px; display: flex; align-items: center; justify-content: center;
    font-size: 44px; margin: 0 auto 24px; box-shadow: 0 0 35px rgba(0,245,155,0.3);
    animation: floatGem 3s ease-in-out infinite alternate;
  }
  @keyframes floatGem {
    0% { transform: translateY(0) scale(0.98); box-shadow: 0 0 20px rgba(0,245,155,0.2); }
    100% { transform: translateY(-6px) scale(1.02); box-shadow: 0 0 40px rgba(0,245,155,0.5); }
  }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.5px; }
  .badge {
    display: inline-block; background: rgba(0,245,155,0.1); color: var(--emerald);
    font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 20px;
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; border: 1px solid rgba(0,245,155,0.2);
  }
  p { font-size: 13px; color: var(--ink-dim); margin: 0 0 28px; line-height: 1.5; }
  .progress-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; position: relative; }
  .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--emerald), var(--purple)); border-radius: 99px; transition: width 0.3s ease; box-shadow: 0 0 15px var(--emerald); }
  .loading-status { font-size: 12px; font-weight: 700; color: var(--ink-dim); margin-top: 14px; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="splash-card">
  <div class="gem-icon">💎</div>
  <div class="badge">Reward Hub</div>
  <h1>Loading App...</h1>
  <p id="statusText">Initializing secure WebApp session & reward hub...</p>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="loading-status" id="statusPercent">0%</div>
</div>

<!-- Force Join Modal -->
<div id="forceJoinModal" style="display:none; position:fixed; inset:0; background:rgba(4,9,7,0.96); z-index:99999; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
  <div style="background:var(--bg-card); border:1px solid var(--border-emerald); border-radius:28px; padding:32px 24px; max-width:360px; width:100%; box-shadow:0 25px 50px rgba(0,0,0,0.9);">
    <div style="font-size:42px; margin-bottom:12px;">📢</div>
    <h2 style="font-size:20px; font-weight:800; color:#fff; margin:0 0 10px;">Mandatory Channel Join</h2>
    <p style="font-size:13px; color:var(--ink-dim); margin:0 0 24px; line-height:1.5;">Please join our official Payout Proofs channel first to access Reward Hub and claim rewards.</p>
    <a id="joinChannelBtn" href="https://t.me/rewardhubpayoutbot" target="_blank" style="display:block; background:linear-gradient(135deg, #2AABEE, #229ED9); color:#fff; text-decoration:none; padding:12px; border-radius:12px; font-weight:800; font-size:14px; margin-bottom:12px; box-shadow:0 4px 15px rgba(34,158,217,0.3);">📢 Join Payout Channel</a>
    <button id="verifyJoinBtn" style="width:100%; background:linear-gradient(135deg, var(--emerald), #059669); color:#04100D; border:none; padding:12px; border-radius:12px; font-weight:800; font-size:14px; cursor:pointer;">✓ I've Joined — Continue</button>
  </div>
</div>

<script>
(async function() {
  'use strict';
  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#040907');
    } catch (e) {}
  }

  const bar = document.getElementById("progressBar");
  const percentEl = document.getElementById("statusPercent");
  const statusEl = document.getElementById("statusText");

  let progress = 0;
  const timer = setInterval(() => {
    progress += Math.floor(Math.random() * 18) + 10;
    if (progress >= 100) {
      progress = 100;
      clearInterval(timer);
    }
    bar.style.width = progress + "%";
    percentEl.textContent = progress + "%";
    
    if (progress > 60) {
      statusEl.textContent = "Loading your balance & rewards...";
    } else if (progress > 30) {
      statusEl.textContent = "Connecting to secure server...";
    }
  }, 150);

  // Wait for progress to finish
  while (progress < 100) {
    await new Promise(r => setTimeout(r, 100));
  }

  statusEl.textContent = "Verifying channel subscription...";

  // Check Force Join Membership
  async function checkMembership() {
    const initData = tg?.initData || '';
    try {
      const res = await fetch(`https://reward-hub-production.up.railway.app/api/channel/check`, {
        headers: { "X-Init-Data": initData }
      });
      if (res.ok) {
        const data = await res.json();
        if (data.joined === false) {
          if (data.channel) {
            document.getElementById("joinChannelBtn").href = `https://t.me/${data.channel.replace('@','')}`;
          }
          document.getElementById("forceJoinModal").style.display = "flex";
          return false;
        }
      }
    } catch (e) {}
    return true;
  }

  const isJoined = await checkMembership();
  if (isJoined) {
    statusEl.textContent = "Launching Reward Hub...";
    setTimeout(() => {
      const searchParams = window.location.search || '';
      window.location.replace(`app.html${searchParams}`);
    }, 300);
  }

  document.getElementById("verifyJoinBtn").onclick = async () => {
    try { tg?.HapticFeedback?.impactOccurred('medium'); } catch(e){}
    const joined = await checkMembership();
    if (joined) {
      document.getElementById("forceJoinModal").style.display = "none";
      const searchParams = window.location.search || '';
      window.location.replace(`app.html${searchParams}`);
    } else {
      alert("⚠️ Please join the channel first before continuing!");
    }
  };
})();
</script>

</body>
</html>
