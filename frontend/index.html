<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Reward Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- AdsGram SDK -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #040F0B;
    --bg-1: #0A261D;
    --bg-2: #0F3D2E;
    --emerald: #10B981;
    --emerald-glow: rgba(16, 185, 129, 0.4);
    --amethyst: #8B5CF6;
    --gold: #F59E0B;
    --gold-glow: rgba(245, 158, 11, 0.4);
    --ink: #FFFFFF;
    --ink-dim: #9CA3AF;
    --facet-border: rgba(255, 255, 255, 0.12);
    --card-bg: linear-gradient(145deg, rgba(15, 61, 46, 0.9), rgba(7, 33, 25, 0.98));
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg-0); color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif; overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; }
  
  .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Topbar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -0.02em; }
  .brand .gem-icon {
    width: 28px; height: 28px;
    background: conic-gradient(from 45deg, var(--emerald), var(--amethyst), var(--gold), var(--emerald));
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    box-shadow: 0 0 20px var(--emerald-glow);
  }
  .vip-badge {
    background: linear-gradient(135deg, var(--gold), #D97706); color: #000;
    font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 6px;
    letter-spacing: 0.05em; box-shadow: 0 0 12px var(--gold-glow);
  }
  .balance-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4);
    padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 15px; color: #34D399;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.15), 0 4px 15px rgba(16,185,129,0.15);
  }

  /* Broadcast Banner */
  .broadcast-banner {
    display: none; background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.08));
    border: 1px solid rgba(245, 158, 11, 0.4); padding: 14px 18px; border-radius: 16px;
    margin-bottom: 18px; font-size: 13px; color: #FDE68A; font-weight: 600; line-height: 1.5;
    box-shadow: 0 6px 25px rgba(0,0,0,0.3); animation: pulseGlow 3s infinite alternate;
  }
  @keyframes pulseGlow {
    0% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 4px 15px rgba(245,158,11,0.1); }
    100% { border-color: rgba(245, 158, 11, 0.8); box-shadow: 0 6px 25px rgba(245,158,11,0.3); }
  }

  /* Hero Card */
  .hero {
    padding: 26px 22px; margin-bottom: 18px; border-radius: 24px; background: var(--card-bg);
    border: 1px solid var(--facet-border); box-shadow: 0 12px 35px rgba(0,0,0,0.4);
    position: relative; overflow: hidden;
  }
  .hero::after {
    content: ''; position: absolute; top: -60px; right: -60px; width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, transparent 70%); pointer-events: none;
  }
  .hero .label { color: var(--ink-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
  .hero .amount { font-size: 40px; font-weight: 800; margin-top: 6px; display: flex; align-items: baseline; gap: 8px; letter-spacing: -0.02em; color: var(--ink); }
  .hero .usdt { font-size: 16px; color: var(--ink-dim); font-weight: 600; }
  .hero .row { display: flex; gap: 12px; margin-top: 20px; }
  .hero .row button {
    flex: 1; border: none; border-radius: 14px; padding: 13px; font-weight: 800; font-size: 14px; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .hero .row button:active { transform: scale(0.96); }
  .btn-convert {
    background: rgba(139, 92, 246, 0.2); color: #DDD6FE; border: 1px solid rgba(139, 92, 246, 0.5) !important;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.15);
  }
  .btn-withdraw {
    background: linear-gradient(135deg, var(--gold), #D97706); color: #000; box-shadow: 0 4px 20px var(--gold-glow);
  }

  /* Section Header */
  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 4px 12px; }
  .section-title h2 { font-size: 17px; margin: 0; letter-spacing: -0.01em; font-weight: 800; }
  .section-title .eyebrow { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }

  /* Daily Grid */
  .daily-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .day-cell {
    padding: 14px 6px; text-align: center; font-size: 12px; color: var(--ink-dim);
    border-radius: 14px; background: var(--card-bg); border: 1px solid var(--facet-border);
    transition: all 0.2s;
  }
  .day-cell.done { background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(16,185,129,0.08)); border-color: rgba(16,185,129,0.5); color: #34D399; }
  .day-cell.today { background: linear-gradient(135deg, rgba(139,92,246,0.35), rgba(139,92,246,0.12)); border-color: rgba(139,92,246,0.7); color: #EDE9FE; box-shadow: 0 0 20px rgba(139,92,246,0.25); }
  .day-cell .d { font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .day-cell .r { font-weight: 800; color: var(--gold); }

  .main-action-btn {
    width: 100%; margin-top: 14px; padding: 15px; background: linear-gradient(135deg, var(--emerald), #059669);
    color: #04100D; border: none; border-radius: 16px; font-weight: 800; font-size: 15px; cursor: pointer;
    box-shadow: 0 6px 25px var(--emerald-glow); transition: transform 0.15s ease;
  }
  .main-action-btn:active { transform: scale(0.97); }
  .main-action-btn:disabled { opacity: 0.5; filter: grayscale(0.5); cursor: not-allowed; box-shadow: none; }

  .ad-btn {
    width: 100%; margin-top: 10px; padding: 14px; background: rgba(139, 92, 246, 0.08); border: 1px dashed rgba(139,92,246,0.6);
    color: #DDD6FE; border-radius: 16px; font-weight: 700; font-size: 13px; cursor: pointer;
    transition: background 0.2s;
  }
  .ad-btn:hover { background: rgba(139,92,246,0.15); }

  /* Wheel */
  .wheel-wrap { display: flex; flex-direction: column; align-items: center; padding: 28px 16px; border-radius: 24px; background: var(--card-bg); border: 1px solid var(--facet-border); box-shadow: 0 12px 35px rgba(0,0,0,0.4); }
  .wheel-outer { position: relative; width: 250px; height: 250px; }
  .wheel {
    width: 250px; height: 250px; border-radius: 50%; position: relative;
    border: 6px solid rgba(255,255,255,0.12); box-shadow: 0 0 0 3px rgba(16,185,129,0.3), 0 15px 40px rgba(0,0,0,0.6);
    transition: transform 4s cubic-bezier(0.12, 0.67, 0.1, 1);
  }
  .wheel-pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
    border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 20px solid var(--gold);
    z-index: 5; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
  }
  .wheel-label { position: absolute; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
  .spin-btn {
    margin-top: 22px; background: linear-gradient(135deg, var(--gold), #D97706); color: #000;
    font-weight: 800; border: none; padding: 15px 40px; border-radius: 999px; font-size: 16px; cursor: pointer;
    box-shadow: 0 6px 25px var(--gold-glow); transition: transform 0.15s ease;
  }
  .spin-btn:active { transform: scale(0.96); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .spins-left { margin-top: 10px; font-size: 13px; color: var(--ink-dim); font-weight: 600; }
  .bonus-spin-link { font-size: 13px; color: #DDD6FE; margin-top: 8px; text-decoration: underline; cursor: pointer; font-weight: 700; }

  /* Tasks */
  .task-card {
    display: flex; align-items: center; justify-content: space-between; padding: 18px; margin-bottom: 12px;
    border-radius: 16px; background: var(--card-bg); border: 1px solid var(--facet-border);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3); transition: transform 0.2s;
  }
  .task-info { display: flex; flex-direction: column; gap: 5px; }
  .task-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .task-reward { font-size: 13px; color: var(--gold); font-weight: 800; display: flex; align-items: center; gap: 4px; }
  .task-btn {
    background: linear-gradient(135deg, var(--emerald), #059669); color: #04100D; border: none;
    padding: 11px 20px; border-radius: 999px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 15px var(--emerald-glow); transition: transform 0.15s ease;
  }
  .task-btn:active { transform: scale(0.95); }
  .task-btn.claimed { background: transparent; border: 1px solid var(--facet-border); color: var(--ink-dim); box-shadow: none; cursor: default; }

  /* Referral Card */
  .ref-card { padding: 24px; text-align: center; border-radius: 24px; background: var(--card-bg); border: 1px solid var(--facet-border); box-shadow: 0 12px 35px rgba(0,0,0,0.4); }
  .ref-count { font-size: 34px; font-weight: 800; font-family: 'Space Grotesk', sans-serif; color: var(--emerald); text-shadow: 0 0 20px var(--emerald-glow); }
  .ref-code { margin-top: 10px; font-family: monospace; font-size: 15px; background: rgba(0,0,0,0.4); padding: 10px 16px; border-radius: 10px; display: inline-block; letter-spacing: 0.05em; color: var(--gold); border: 1px solid rgba(245,158,11,0.3); }
  .ref-btn {
    margin-top: 16px; background: linear-gradient(135deg, var(--amethyst), #7C3AED); color: #fff; border: none;
    padding: 14px 24px; border-radius: 999px; font-weight: 800; font-size: 15px; cursor: pointer; width: 100%;
    box-shadow: 0 6px 20px rgba(139,92,246,0.4); transition: transform 0.15s ease;
  }
  .ref-btn:active { transform: scale(0.97); }

  /* Gift Code */
  .gift-row { display: flex; gap: 10px; padding: 16px; border-radius: 18px; background: var(--card-bg); border: 1px solid var(--facet-border); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
  .gift-row input {
    flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--facet-border); border-radius: 12px; padding: 13px 16px;
    color: var(--ink); font-size: 14px; outline: none; font-weight: 600;
  }
  .gift-row input:focus { border-color: var(--emerald); }
  .gift-row button {
    background: linear-gradient(135deg, var(--emerald), #059669); color: #04100D; border: none; padding: 13px 22px;
    border-radius: 12px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px var(--emerald-glow);
  }

  /* Top-to-Bottom Toast Notification */
  .toast {
    position: fixed; top: 18px; left: 16px; right: 16px; max-width: 448px; margin: 0 auto;
    background: linear-gradient(135deg, #0F3D2E, #051C14); border: 1px solid var(--emerald);
    padding: 16px 22px; border-radius: 16px; font-size: 14px; font-weight: 700; text-align: center;
    color: var(--ink); transform: translateY(-180%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,0.7);
  }
  .toast.show { transform: translateY(0); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    display: none; align-items: flex-end; z-index: 60; animation: fadeIn 0.2s ease;
  }
  .modal-backdrop.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #0A261D; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 28px 28px 0 0;
    padding: 26px 22px 40px; border: 1px solid var(--facet-border); box-shadow: 0 -15px 50px rgba(0,0,0,0.7);
    animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { margin: 0 0 18px; font-size: 19px; font-weight: 800; color: var(--ink); }
  .modal input, .modal select {
    width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--facet-border); border-radius: 14px;
    padding: 14px 16px; color: var(--ink); font-size: 14px; margin-bottom: 14px; outline: none; font-weight: 600;
  }
  .modal input:focus, .modal select:focus { border-color: var(--gold); }
  .modal button.primary {
    width: 100%; background: linear-gradient(135deg, var(--gold), #D97706); color: #000; border: none;
    padding: 15px; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer;
    box-shadow: 0 6px 25px var(--gold-glow); margin-top: 8px;
  }
  .modal .close { float: right; color: var(--ink-dim); cursor: pointer; font-size: 20px; font-weight: 800; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><span class="gem-icon"></span> Reward Hub <span class="vip-badge" id="vipBadge" style="display:none;">VIP</span></div>
    <div class="balance-pill">💎 <span id="gemsBalance">0</span></div>
  </div>

  <div id="broadcastBanner" class="broadcast-banner">
    📣 <span id="broadcastText"></span>
  </div>

  <div class="hero">
    <div class="label">Cash-out balance</div>
    <div class="amount" id="usdtBalance">$0.00 <span class="usdt">USDT</span></div>
    <div class="row">
      <button class="btn-convert" id="convertBtn">Convert gems</button>
      <button class="btn-withdraw" id="withdrawBtn">Withdraw</button>
    </div>
    <div id="conversionRateLabel" style="font-size:12px; color:var(--ink-dim); margin-top:14px; text-align:center; font-weight:600;">— gems = $1.00 USDT</div>
  </div>

  <div class="section-title"><h2>Daily Rewards</h2><span class="eyebrow" id="streakLabel">Streak: 0</span></div>
  <div class="daily-grid" id="dailyGrid"></div>
  <button class="main-action-btn" id="claimDailyBtn">Claim today's reward</button>
  <button class="ad-btn" id="watchAdDailyBtn">▶ Watch ad for +40 bonus gems</button>

  <div class="section-title"><h2>Spin the Wheel</h2><span class="eyebrow" id="spinsLeftLabel">— left today</span></div>
  <div class="wheel-wrap">
    <div class="wheel-outer">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel"></div>
    </div>
    <button class="spin-btn" id="spinBtn">Spin for Gems</button>
    <div class="bonus-spin-link" id="watchAdSpinBtn">▶ Watch ad for +1 spin</div>
  </div>

  <div class="section-title"><h2>Tasks</h2><span class="eyebrow">Earn more gems</span></div>
  <div id="taskList"></div>

  <div class="section-title"><h2>Gift Code</h2><span class="eyebrow">Redeem</span></div>
  <div class="gift-row">
    <input type="text" id="giftInput" placeholder="Enter gift code" />
    <button id="giftBtn">Redeem</button>
  </div>

  <div class="section-title"><h2>Invite Friends</h2><span class="eyebrow">Referral</span></div>
  <div class="ref-card">
    <div class="ref-count" id="refCount">0</div>
    <div style="font-size:12px; color:var(--ink-dim); margin-top:3px; margin-bottom:12px; font-weight:600;">friends invited</div>
    <div class="ref-code" id="refCode" style="margin-bottom:14px;">—</div>
    <div style="margin-bottom:18px; font-size:12px; color:var(--ink-dim); word-break:break-all; background:rgba(0,0,0,0.4); padding:12px 14px; border-radius:12px; text-align:left; border: 1px solid var(--facet-border);">
      🔗 <a id="refLink" href="#" target="_blank" style="color:var(--emerald); text-decoration:underline; font-weight:700;">https://t.me/...</a>
    </div>
    <button class="ref-btn" id="shareBtn">Share invite link</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="withdrawModal">
  <div class="modal">
    <span class="close" id="closeWithdraw">✕</span>
    <h3>Withdraw USDT</h3>
    <input type="number" id="wdAmount" placeholder="Amount (USDT)" step="0.01" />
    <select id="wdMethod">
      <option value="binance_pay">Binance Pay</option>
      <option value="usdt_address">USDT Address (TRC20)</option>
    </select>
    <input type="text" id="wdDestination" placeholder="Binance Pay ID or wallet address" />
    <button class="primary" id="wdSubmit">Request withdrawal</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const API_BASE = "https://reward-hub-production.up.railway.app";

const urlParams = new URLSearchParams(window.location.search);
const refFromLink = urlParams.get("ref");

let APP_SETTINGS = { adsgram_block_id: "", bot_username: "", app_name: "Reward Hub", gems_per_usdt: "1000", admin_broadcast: "" };
let AdController = null;

async function loadAppSettings() {
  try {
    const res = await fetch(`${API_BASE}/api/settings`);
    APP_SETTINGS = await res.json();
  } catch (e) { console.warn("Could not load app settings", e); }

  document.title = APP_SETTINGS.app_name || "Reward Hub";

  if (APP_SETTINGS.admin_broadcast) {
    document.getElementById("broadcastText").textContent = APP_SETTINGS.admin_broadcast;
    document.getElementById("broadcastBanner").style.display = "block";
  } else {
    document.getElementById("broadcastBanner").style.display = "none";
  }

  const rate = APP_SETTINGS.gems_per_usdt || "1000";
  document.getElementById("conversionRateLabel").textContent = `${Number(rate).toLocaleString()} gems = $1.00 USDT`;

  try {
    if (window.Adsgram && APP_SETTINGS.adsgram_block_id) {
      AdController = window.Adsgram.init({ blockId: APP_SETTINGS.adsgram_block_id });
    }
  } catch (e) { console.warn("AdsGram init failed", e); }
}

function authHeaders() {
  const h = { "Content-Type": "application/json", "X-Init-Data": tg?.initData || "" };
  if (refFromLink) h["X-Ref-Code"] = refFromLink;
  return h;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  tg?.HapticFeedback?.notificationOccurred('success');
  setTimeout(() => t.classList.remove("show"), 3500);
}

let me = null;
let wheelSegments = [];

async function loadMe() {
  const res = await fetch(`${API_BASE}/api/me`, { headers: authHeaders() });
  me = await res.json();
  document.getElementById("gemsBalance").textContent = me.gems.toLocaleString();
  document.getElementById("usdtBalance").innerHTML = `$${me.balance_usdt.toFixed(2)} <span class="usdt">USDT</span>`;
  document.getElementById("streakLabel").textContent = `Streak: ${me.daily_streak}`;
  document.getElementById("refCode").textContent = me.referral_code;
  document.getElementById("vipBadge").style.display = me.is_vip ? "inline-block" : "none";
}

async function loadDaily() {
  const res = await fetch(`${API_BASE}/api/daily-reward/status`, { headers: authHeaders() });
  const data = await res.json();
  const grid = document.getElementById("dailyGrid");
  grid.innerHTML = "";
  data.ladder.forEach((reward, i) => {
    const day = i + 1;
    const done = day <= data.current_streak && !data.claimable;
    const isToday = data.claimable && day === Math.min(data.current_streak + 1, data.ladder.length);
    const cell = document.createElement("div");
    cell.className = "day-cell" + (done ? " done" : "") + (isToday ? " today" : "");
    cell.innerHTML = `<div class="d">Day ${day}</div><div class="r">+${reward}</div>`;
    grid.appendChild(cell);
  });
  document.getElementById("claimDailyBtn").disabled = !data.claimable;
  document.getElementById("claimDailyBtn").textContent = data.claimable ? "Claim today's reward" : "Come back tomorrow";
}

document.getElementById("claimDailyBtn").onclick = async () => {
  tg?.HapticFeedback?.impactOccurred('medium');
  const res = await fetch(`${API_BASE}/api/daily-reward/claim`, { method: "POST", headers: authHeaders() });
  if (!res.ok) {
    tg?.HapticFeedback?.notificationOccurred('error');
    return toast((await res.json()).detail || "Could not claim");
  }
  const data = await res.json();
  toast(`🎁 +${data.reward_gems} gems claimed! Streak: ${data.new_streak}`);
  await Promise.all([loadMe(), loadDaily()]);
};

async function showAd(placement) {
  tg?.HapticFeedback?.impactOccurred('light');
  if (!AdController) { toast("Ads not available right now"); return false; }
  try {
    await AdController.show();
    const res = await fetch(`${API_BASE}/api/ads/reward`, {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ placement }),
    });
    const data = await res.json();
    if (data.reward_gems) toast(`🎬 +${data.reward_gems} gems earned from ad!`);
    if (data.bonus_spins) toast(`🎡 +${data.bonus_spins} bonus spin earned!`);
    await loadMe();
    return true;
  } catch (e) {
    toast("Ad was skipped or failed");
    return false;
  }
}

document.getElementById("watchAdDailyBtn").onclick = () => showAd("daily_bonus");
document.getElementById("watchAdSpinBtn").onclick = async () => { await showAd("spin_bonus"); await loadSpinStatus(); };

function renderWheel(segments) {
  const wheel = document.getElementById("wheel");
  wheel.innerHTML = "";
  const n = segments.length;
  const slice = 360 / n;
  const gradientStops = segments.map((s, i) => `${s.color} ${i * slice}deg ${(i + 1) * slice}deg`).join(", ");
  wheel.style.background = `conic-gradient(${gradientStops})`;

  segments.forEach((s, i) => {
    const angle = i * slice + slice / 2;
    const label = document.createElement("div");
    label.className = "wheel-label";
    label.textContent = s.label;
    label.style.left = "50%";
    label.style.top = "50%";
    label.style.transform = `rotate(${angle}deg) translate(0, -92px) rotate(${-angle}deg) translate(-50%, -50%)`;
    wheel.appendChild(label);
  });
}

async function loadSpinStatus() {
  const res = await fetch(`${API_BASE}/api/spin/wheel`, { headers: authHeaders() });
  const data = await res.json();
  wheelSegments = data.segments;
  renderWheel(wheelSegments);
  const allowance = data.max_spins_per_day + (me?.bonus_spins || 0);
  document.getElementById("spinsLeftLabel").textContent = `up to ${allowance} left today`;
}

let currentRotation = 0;

document.getElementById("spinBtn").onclick = async () => {
  tg?.HapticFeedback?.impactOccurred('heavy');
  const btn = document.getElementById("spinBtn");
  btn.disabled = true;

  const res = await fetch(`${API_BASE}/api/spin`, { method: "POST", headers: authHeaders() });
  if (!res.ok) {
    tg?.HapticFeedback?.notificationOccurred('error');
    toast((await res.json()).detail || "Could not spin");
    btn.disabled = false;
    return;
  }
  const data = await res.json();

  const slice = 360 / data.total_segments;
  const targetAngle = 360 * 6 - (data.segment_index * slice + slice / 2);
  currentRotation += 360 - ((currentRotation) % 360) + targetAngle;
  const wheel = document.getElementById("wheel");
  wheel.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(async () => {
    toast(`🎉 You won +${data.reward_gems} gems!`);
    document.getElementById("spinsLeftLabel").textContent = `${data.spins_left} left today`;
    btn.disabled = data.spins_left <= 0;
    await loadMe();
  }, 4100);
};

async function loadTasks() {
  const res = await fetch(`${API_BASE}/api/tasks`, { headers: authHeaders() });
  const tasks = await res.json();
  const list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.forEach(t => {
    const claimed = t.status === "claimed";
    const card = document.createElement("div");
    card.className = "task-card";
    card.innerHTML = `
      <div class="task-info">
        <div class="task-title">${t.title}</div>
        <div class="task-reward">💎 +${t.reward_gems} gems</div>
      </div>
      <button class="task-btn ${claimed ? "claimed" : ""}" ${claimed ? "disabled" : ""}>${claimed ? "Claimed" : "Start"}</button>
    `;
    card.querySelector("button").onclick = async () => {
      tg?.HapticFeedback?.impactOccurred('medium');
      if (t.link) window.open(t.link, "_blank");
      const r = await fetch(`${API_BASE}/api/tasks/claim`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ task_id: t.id })
      });
      if (!r.ok) {
        tg?.HapticFeedback?.notificationOccurred('error');
        return toast((await r.json()).detail || "Could not claim");
      }
      const d = await r.json();
      toast(`✅ +${d.reward_gems} gems claimed!`);
      await Promise.all([loadMe(), loadTasks()]);
    };
    list.appendChild(card);
  });
}

async function loadReferral() {
  const res = await fetch(`${API_BASE}/api/referral`, { headers: authHeaders() });
  const data = await res.json();
  document.getElementById("refCount").textContent = data.invited_count;
  document.getElementById("refCode").textContent = data.referral_code;

  const username = APP_SETTINGS.bot_username || "YourBot";
  const link = `https://t.me/${username}?start=${data.referral_code}`;
  const refLinkEl = document.getElementById("refLink");
  refLinkEl.textContent = link;
  refLinkEl.href = link;

  document.getElementById("shareBtn").onclick = () => {
    tg?.HapticFeedback?.impactOccurred('medium');
    const appName = APP_SETTINGS.app_name || "Reward Hub";
    tg?.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(`Join me on ${appName} and earn gems & USDT 🎁`)}`);
  };
}

document.getElementById("giftBtn").onclick = async () => {
  tg?.HapticFeedback?.impactOccurred('medium');
  const code = document.getElementById("giftInput").value.trim();
  if (!code) return;
  const res = await fetch(`${API_BASE}/api/gift-code/redeem`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ code })
  });
  if (!res.ok) {
    tg?.HapticFeedback?.notificationOccurred('error');
    return toast((await res.json()).detail || "Invalid code");
  }
  const data = await res.json();
  let msg = "🎁 Gift code redeemed!";
  if (data.reward_gems) msg += ` +${data.reward_gems} gems`;
  if (data.reward_spins) msg += ` +${data.reward_spins} spins`;
  if (data.reward_usdt) msg += ` +$${data.reward_usdt} USDT`;
  toast(msg);
  document.getElementById("giftInput").value = "";
  await Promise.all([loadMe(), loadSpinStatus()]);
};

document.getElementById("convertBtn").onclick = async () => {
  tg?.HapticFeedback?.impactOccurred('medium');
  const res = await fetch(`${API_BASE}/api/gems/convert`, { method: "POST", headers: authHeaders() });
  if (!res.ok) {
    tg?.HapticFeedback?.notificationOccurred('error');
    return toast((await res.json()).detail || "Nothing to convert");
  }
  const data = await res.json();
  toast(`✨ Converted successfully to $${data.converted_usdt.toFixed(2)} USDT`);
  await loadMe();
};

document.getElementById("withdrawBtn").onclick = () => {
  tg?.HapticFeedback?.impactOccurred('light');
  document.getElementById("withdrawModal").classList.add("show");
};
document.getElementById("closeWithdraw").onclick = () => {
  document.getElementById("withdrawModal").classList.remove("show");
};
document.getElementById("wdSubmit").onclick = async () => {
  tg?.HapticFeedback?.impactOccurred('medium');
  const amount_usdt = parseFloat(document.getElementById("wdAmount").value);
  const method = document.getElementById("wdMethod").value;
  const destination = document.getElementById("wdDestination").value.trim();
  if (!amount_usdt || !destination) {
    tg?.HapticFeedback?.notificationOccurred('error');
    return toast("Please fill in all fields");
  }

  const res = await fetch(`${API_BASE}/api/withdraw`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ amount_usdt, method, destination })
  });
  if (!res.ok) {
    tg?.HapticFeedback?.notificationOccurred('error');
    return toast((await res.json()).detail || "Could not submit withdrawal");
  }
  toast("🚀 Withdrawal requested — pending review");
  document.getElementById("withdrawModal").classList.remove("show");
  await loadMe();
};

(async function init() {
  await loadAppSettings();
  await loadMe();
  await Promise.all([loadDaily(), loadSpinStatus(), loadTasks(), loadReferral()]);
})();
</script>
