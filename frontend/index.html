<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Reward Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- AdsGram SDK -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0B2E22; --bg-1:#0F3D2E;
    --emerald:#12B886; --amethyst:#9B6BFF; --gold:#F2B705;
    --ink:#EFF6F0; --ink-dim:#9FC2AE; --facet-border: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg-0); color:var(--ink); font-family:'Inter',sans-serif; overscroll-behavior:none;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .app{max-width:480px; margin:0 auto; padding:16px 16px 96px;}
  .facet{
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    background: linear-gradient(155deg, var(--bg-1), #0A2A20);
    border: 1px solid var(--facet-border);
  }
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 4px 20px;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:20px; letter-spacing:-0.02em;}
  .brand .gem-icon{width:22px; height:22px; background:conic-gradient(from 45deg, var(--emerald), var(--amethyst), var(--emerald)); clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);}
  .vip-badge{background:linear-gradient(90deg,var(--gold),#D9A203); color:#1A1200; font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:6px; letter-spacing:0.04em;}
  .balance-pill{display:flex; align-items:center; gap:6px; background:rgba(18,184,134,0.12); border:1px solid rgba(18,184,134,0.35); padding:6px 12px; border-radius:999px; font-weight:600; font-size:14px;}

  .hero{padding:22px 20px; margin-bottom:16px;}
  .hero .label{color:var(--ink-dim); font-size:13px; text-transform:uppercase; letter-spacing:0.08em;}
  .hero .amount{font-size:40px; font-weight:700; margin-top:4px; display:flex; align-items:baseline; gap:8px;}
  .hero .usdt{font-size:15px; color:var(--ink-dim); font-weight:500;}
  .hero .row{display:flex; gap:10px; margin-top:14px;}
  .hero .row button{flex:1; border:none; border-radius:10px; padding:10px; font-weight:700; font-size:13px; cursor:pointer;}
  .btn-convert{background:rgba(155,107,255,0.18); color:#C9B5FF; border:1px solid rgba(155,107,255,0.4) !important;}
  .btn-withdraw{background:var(--gold); color:#1A1200;}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 4px 10px;}
  .section-title h2{font-size:16px; margin:0; letter-spacing:-0.01em;}
  .section-title .eyebrow{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.1em;}

  .daily-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .day-cell{padding:10px 4px; text-align:center; font-size:12px; color:var(--ink-dim);}
  .day-cell.done{background:linear-gradient(155deg, rgba(18,184,134,0.25), rgba(18,184,134,0.08));}
  .day-cell.today{background:linear-gradient(155deg, rgba(155,107,255,0.3), rgba(155,107,255,0.1)); border-color:rgba(155,107,255,0.5);}
  .day-cell .d{font-weight:600; color:var(--ink); margin-bottom:6px;}
  .day-cell .r{font-weight:700; color:var(--gold);}
  .ad-btn{width:100%; margin-top:10px; padding:12px; background:transparent; border:1px dashed var(--amethyst); color:#C9B5FF; border-radius:10px; font-weight:600; font-size:13px; cursor:pointer;}

  .wheel-wrap{display:flex; flex-direction:column; align-items:center; padding:24px 16px;}
  .wheel-outer{position:relative; width:230px; height:230px;}
  .wheel{width:230px; height:230px; border-radius:50%; position:relative;
    border: 4px solid var(--bg-1); box-shadow: 0 0 0 2px rgba(255,255,255,0.06), 0 12px 30px rgba(0,0,0,0.4);
    transition: transform 4s cubic-bezier(.12,.67,.1,1);
  }
  .wheel-pointer{position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:16px solid var(--ink); z-index:3;}
  .wheel-label{position:absolute; font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.5);}
  .spin-btn{margin-top:18px; background:linear-gradient(180deg, var(--gold), #C99200); color:#1A1200; font-weight:700; border:none; padding:13px 30px; border-radius:999px; font-size:15px; cursor:pointer;}
  .spin-btn:disabled{opacity:0.5;}
  .spins-left{margin-top:10px; font-size:12px; color:var(--ink-dim);}
  .bonus-spin-link{font-size:12px; color:var(--amethyst); margin-top:4px; text-decoration:underline; cursor:pointer;}

  .task-card{display:flex; align-items:center; justify-content:space-between; padding:14px; margin-bottom:8px;}
  .task-info{display:flex; flex-direction:column; gap:4px;}
  .task-title{font-size:14px; font-weight:600;}
  .task-reward{font-size:12px; color:var(--gold); font-weight:600;}
  .task-btn{background:var(--emerald); color:#062018; border:none; padding:9px 16px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;}
  .task-btn.claimed{background:transparent; border:1px solid var(--facet-border); color:var(--ink-dim);}

  .ref-card{padding:20px; text-align:center;}
  .ref-count{font-size:28px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .ref-code{margin-top:10px; font-family:monospace; font-size:14px; background:rgba(255,255,255,0.06); padding:8px 12px; border-radius:8px; display:inline-block; letter-spacing:0.05em;}
  .ref-btn{margin-top:14px; background:var(--amethyst); color:#fff; border:none; padding:11px 24px; border-radius:999px; font-weight:700; font-size:14px; cursor:pointer; width:100%;}

  .gift-row{display:flex; gap:8px; padding:14px;}
  .gift-row input{flex:1; background:rgba(255,255,255,0.06); border:1px solid var(--facet-border); border-radius:8px; padding:10px; color:var(--ink); font-size:14px;}
  .gift-row button{background:var(--emerald); color:#062018; border:none; padding:10px 16px; border-radius:8px; font-weight:700; cursor:pointer;}

  .toast{position:fixed; left:16px; right:16px; bottom:20px; max-width:448px; margin:0 auto; background:var(--bg-1); border:1px solid var(--emerald); padding:14px 16px; border-radius:12px; font-size:14px; font-weight:600; text-align:center; transform:translateY(120%); transition:transform 0.3s ease; z-index:50;}
  .toast.show{transform:translateY(0);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end; z-index:60;}
  .modal-backdrop.show{display:flex;}
  .modal{background:var(--bg-1); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:20px; border:1px solid var(--facet-border);}
  .modal h3{margin:0 0 14px;}
  .modal input, .modal select{width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--facet-border); border-radius:8px; padding:11px; color:var(--ink); font-size:14px; margin-bottom:10px;}
  .modal button.primary{width:100%; background:var(--gold); color:#1A1200; border:none; padding:12px; border-radius:10px; font-weight:700; cursor:pointer;}
  .modal .close{float:right; color:var(--ink-dim); cursor:pointer;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><span class="gem-icon"></span> Reward Hub <span class="vip-badge" id="vipBadge" style="display:none;">VIP</span></div>
    <div class="balance-pill">💎 <span id="gemsBalance">0</span></div>
  </div>

  <div id="broadcastBanner" class="facet" style="display:none; background:rgba(242,183,5,0.12); border:1px solid rgba(242,183,5,0.4); padding:12px 16px; border-radius:12px; margin-bottom:16px; font-size:13px; color:#F2B705; font-weight:500; line-height:1.4;">
    📣 <span id="broadcastText"></span>
  </div>

  <div class="hero facet">
    <div class="label">Cash-out balance</div>
    <div class="amount" id="usdtBalance">$0.00 <span class="usdt">USDT</span></div>
    <div class="row">
      <button class="btn-convert" id="convertBtn">Convert gems</button>
      <button class="btn-withdraw" id="withdrawBtn">Withdraw</button>
    </div>
    <div id="conversionRateLabel" style="font-size:12px; color:var(--ink-dim); margin-top:10px; text-align:center;">— gems = $1.00 USDT</div>
  </div>

  <div class="section-title"><h2>Daily Rewards</h2><span class="eyebrow" id="streakLabel">Streak: 0</span></div>
  <div class="daily-grid" id="dailyGrid"></div>
  <button class="task-btn" id="claimDailyBtn" style="width:100%; margin-top:10px; padding:12px;">Claim today's reward</button>
  <button class="ad-btn" id="watchAdDailyBtn">▶ Watch ad for +40 bonus gems</button>

  <div class="section-title"><h2>Spin the Wheel</h2><span class="eyebrow" id="spinsLeftLabel">— left today</span></div>
  <div class="wheel-wrap facet">
    <div class="wheel-outer">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel"></div>
    </div>
    <button class="spin-btn" id="spinBtn">Spin for Gems</button>
    <div class="bonus-spin-link" id="watchAdSpinBtn">▶ Watch ad for +1 spin</div>
  </div>

  <div class="section-title"><h2>Tasks</h2><span class="eyebrow">Earn more gems</span></div>
  <div id="taskList"></div>

  <div class="section-title"><h2>Gift Code</h2><span class="eyebrow">Redeem</span></div>
  <div class="gift-row facet">
    <input type="text" id="giftInput" placeholder="Enter code" />
    <button id="giftBtn">Redeem</button>
  </div>

  <div class="section-title"><h2>Invite Friends</h2><span class="eyebrow">Referral</span></div>
  <div class="ref-card facet">
    <div class="ref-count" id="refCount">0</div>
    <div style="font-size:12px; color:var(--ink-dim); margin-top:2px; margin-bottom:10px;">friends invited</div>
    <div class="ref-code" id="refCode" style="margin-bottom:12px;">—</div>
    <div style="margin-bottom:14px; font-size:12px; color:var(--ink-dim); word-break:break-all; background:rgba(0,0,0,0.25); padding:8px 10px; border-radius:6px; text-align:left;">
      🔗 <a id="refLink" href="#" target="_blank" style="color:var(--emerald); text-decoration:underline;">https://t.me/...</a>
    </div>
    <button class="ref-btn" id="shareBtn">Share invite link</button>
  </div>

</div>
<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="withdrawModal">
  <div class="modal">
    <span class="close" id="closeWithdraw">✕</span>
    <h3>Withdraw USDT</h3>
    <input type="number" id="wdAmount" placeholder="Amount (USDT)" step="0.01" />
    <select id="wdMethod">
      <option value="binance_pay">Binance Pay</option>
      <option value="usdt_address">USDT Address (TRC20)</option>
    </select>
    <input type="text" id="wdDestination" placeholder="Binance Pay ID or wallet address" />
    <button class="primary" id="wdSubmit">Request withdrawal</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const API_BASE = "https://reward-hub-production.up.railway.app"; // Set deployed backend URL

const urlParams = new URLSearchParams(window.location.search);
const refFromLink = urlParams.get("ref");

// AdsGram block id and bot username are admin-configurable (Settings tab in admin.html) —
// fetched from the backend at boot instead of being hardcoded here.
let APP_SETTINGS = { adsgram_block_id: "", bot_username: "", app_name: "Reward Hub" };
let AdController = null;

async function loadAppSettings() {
  try {
    const res = await fetch(`${API_BASE}/api/settings`);
    APP_SETTINGS = await res.json();
  } catch (e) { console.warn("Could not load app settings", e); }

  document.title = APP_SETTINGS.app_name || "Reward Hub";

  // Broadcast banner
  if (APP_SETTINGS.admin_broadcast) {
    document.getElementById("broadcastText").textContent = APP_SETTINGS.admin_broadcast;
    document.getElementById("broadcastBanner").style.display = "block";
  } else {
    document.getElementById("broadcastBanner").style.display = "none";
  }

  // Conversion rate label
  const rate = APP_SETTINGS.gems_per_usdt || "1000";
  document.getElementById("conversionRateLabel").textContent = `${Number(rate).toLocaleString()} gems = $1.00 USDT`;

  try {
    if (window.Adsgram && APP_SETTINGS.adsgram_block_id) {
      AdController = window.Adsgram.init({ blockId: APP_SETTINGS.adsgram_block_id });
    }
  } catch (e) { console.warn("AdsGram init failed", e); }
}

function authHeaders() {
  const h = { "Content-Type": "application/json", "X-Init-Data": tg?.initData || "" };
  if (refFromLink) h["X-Ref-Code"] = refFromLink;
  return h;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

let me = null;
let wheelSegments = [];

async function loadMe() {
  const res = await fetch(`${API_BASE}/api/me`, { headers: authHeaders() });
  me = await res.json();
  document.getElementById("gemsBalance").textContent = me.gems.toLocaleString();
  document.getElementById("usdtBalance").innerHTML = `$${me.balance_usdt.toFixed(2)} <span class="usdt">USDT</span>`;
  document.getElementById("streakLabel").textContent = `Streak: ${me.daily_streak}`;
  document.getElementById("refCode").textContent = me.referral_code;
  document.getElementById("vipBadge").style.display = me.is_vip ? "inline-block" : "none";
}

async function loadDaily() {
  const res = await fetch(`${API_BASE}/api/daily-reward/status`, { headers: authHeaders() });
  const data = await res.json();
  const grid = document.getElementById("dailyGrid");
  grid.innerHTML = "";
  data.ladder.forEach((reward, i) => {
    const day = i + 1;
    const done = day <= data.current_streak && !data.claimable;
    const isToday = data.claimable && day === Math.min(data.current_streak + 1, data.ladder.length);
    const cell = document.createElement("div");
    cell.className = "day-cell facet" + (done ? " done" : "") + (isToday ? " today" : "");
    cell.innerHTML = `<div class="d">Day ${day}</div><div class="r">+${reward}</div>`;
    grid.appendChild(cell);
  });
  document.getElementById("claimDailyBtn").disabled = !data.claimable;
  document.getElementById("claimDailyBtn").textContent = data.claimable ? "Claim today's reward" : "Come back tomorrow";
}

document.getElementById("claimDailyBtn").onclick = async () => {
  const res = await fetch(`${API_BASE}/api/daily-reward/claim`, { method: "POST", headers: authHeaders() });
  if (!res.ok) return toast((await res.json()).detail || "Could not claim");
  const data = await res.json();
  toast(`+${data.reward_gems} gems! Streak: ${data.new_streak}`);
  await Promise.all([loadMe(), loadDaily()]);
};

async function showAd(placement) {
  if (!AdController) { toast("Ads not available right now"); return false; }
  try {
    await AdController.show();
    const res = await fetch(`${API_BASE}/api/ads/reward`, {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ placement }),
    });
    const data = await res.json();
    if (data.reward_gems) toast(`+${data.reward_gems} gems from ad!`);
    if (data.bonus_spins) toast(`+${data.bonus_spins} bonus spin!`);
    await loadMe();
    return true;
  } catch (e) {
    toast("Ad was skipped or failed");
    return false;
  }
}

document.getElementById("watchAdDailyBtn").onclick = () => showAd("daily_bonus");
document.getElementById("watchAdSpinBtn").onclick = async () => { await showAd("spin_bonus"); await loadSpinStatus(); };

// ---------------- Spin wheel: renders REAL backend segments (incl. decorative ones) ----------------

function renderWheel(segments) {
  const wheel = document.getElementById("wheel");
  wheel.innerHTML = "";
  const n = segments.length;
  const slice = 360 / n;
  const gradientStops = segments.map((s, i) => `${s.color} ${i * slice}deg ${(i + 1) * slice}deg`).join(", ");
  wheel.style.background = `conic-gradient(${gradientStops})`;

  segments.forEach((s, i) => {
    const angle = i * slice + slice / 2;
    const label = document.createElement("div");
    label.className = "wheel-label";
    label.textContent = s.label;
    label.style.left = "50%";
    label.style.top = "50%";
    label.style.transform = `rotate(${angle}deg) translate(0, -85px) rotate(${-angle}deg) translate(-50%, -50%)`;
    wheel.appendChild(label);
  });
}

async function loadSpinStatus() {
  const res = await fetch(`${API_BASE}/api/spin/wheel`, { headers: authHeaders() });
  const data = await res.json();
  wheelSegments = data.segments;
  renderWheel(wheelSegments);
  const allowance = data.max_spins_per_day + (me?.bonus_spins || 0);
  document.getElementById("spinsLeftLabel").textContent = `up to ${allowance} left today`;
}

let currentRotation = 0;

document.getElementById("spinBtn").onclick = async () => {
  const btn = document.getElementById("spinBtn");
  btn.disabled = true;

  const res = await fetch(`${API_BASE}/api/spin`, { method: "POST", headers: authHeaders() });
  if (!res.ok) { toast((await res.json()).detail || "Could not spin"); btn.disabled = false; return; }
  const data = await res.json();

  // Rotate so the pointer (fixed at top) ends exactly on the winning segment.
  const slice = 360 / data.total_segments;
  const targetAngle = 360 * 6 - (data.segment_index * slice + slice / 2);
  currentRotation += 360 - ((currentRotation) % 360) + targetAngle; // always spin forward
  const wheel = document.getElementById("wheel");
  wheel.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(async () => {
    toast(`You won +${data.reward_gems} gems!`);
    document.getElementById("spinsLeftLabel").textContent = `${data.spins_left} left today`;
    btn.disabled = data.spins_left <= 0;
    await loadMe();
  }, 4100);
};

// ---------------------------------------------------------------- tasks --

async function loadTasks() {
  const res = await fetch(`${API_BASE}/api/tasks`, { headers: authHeaders() });
  const tasks = await res.json();
  const list = document.getElementById("taskList");
  list.innerHTML = "";
  tasks.forEach(t => {
    const claimed = t.status === "claimed";
    const card = document.createElement("div");
    card.className = "task-card facet";
    card.innerHTML = `
      <div class="task-info">
        <div class="task-title">${t.title}</div>
        <div class="task-reward">+${t.reward_gems} gems</div>
      </div>
      <button class="task-btn ${claimed ? "claimed" : ""}" ${claimed ? "disabled" : ""}>${claimed ? "Claimed" : "Claim"}</button>
    `;
    card.querySelector("button").onclick = async () => {
      if (t.link) window.open(t.link, "_blank");
      const r = await fetch(`${API_BASE}/api/tasks/claim`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ task_id: t.id })
      });
      if (!r.ok) return toast((await r.json()).detail || "Could not claim");
      const d = await r.json();
      toast(`+${d.reward_gems} gems!`);
      await Promise.all([loadMe(), loadTasks()]);
    };
    list.appendChild(card);
  });
}

// -------------------------------------------------------------- referral --

async function loadReferral() {
  const res = await fetch(`${API_BASE}/api/referral`, { headers: authHeaders() });
  const data = await res.json();
  document.getElementById("refCount").textContent = data.invited_count;
  document.getElementById("refCode").textContent = data.referral_code;

  const username = APP_SETTINGS.bot_username || "YourBot";
  const link = `https://t.me/${username}?start=${data.referral_code}`;
  const refLinkEl = document.getElementById("refLink");
  refLinkEl.textContent = link;
  refLinkEl.href = link;

  document.getElementById("shareBtn").onclick = () => {
    const appName = APP_SETTINGS.app_name || "Reward Hub";
    tg?.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(`Join me on ${appName} and earn gems 🎁`)}`);
  };
}

// ------------------------------------------------------------- gift code --

document.getElementById("giftBtn").onclick = async () => {
  const code = document.getElementById("giftInput").value.trim();
  if (!code) return;
  const res = await fetch(`${API_BASE}/api/gift-code/redeem`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ code })
  });
  if (!res.ok) return toast((await res.json()).detail || "Invalid code");
  const data = await res.json();
  toast(`+${data.reward_gems} gems, +${data.reward_spins} spins!`);
  document.getElementById("giftInput").value = "";
  await Promise.all([loadMe(), loadSpinStatus()]);
};

// -------------------------------------------------------------- withdraw --

document.getElementById("convertBtn").onclick = async () => {
  const res = await fetch(`${API_BASE}/api/gems/convert`, { method: "POST", headers: authHeaders() });
  if (!res.ok) return toast((await res.json()).detail || "Nothing to convert");
  const data = await res.json();
  toast(`Converted to $${data.converted_usdt.toFixed(2)} USDT`);
  await loadMe();
};

document.getElementById("withdrawBtn").onclick = () => document.getElementById("withdrawModal").classList.add("show");
document.getElementById("closeWithdraw").onclick = () => document.getElementById("withdrawModal").classList.remove("show");
document.getElementById("wdSubmit").onclick = async () => {
  const amount_usdt = parseFloat(document.getElementById("wdAmount").value);
  const method = document.getElementById("wdMethod").value;
  const destination = document.getElementById("wdDestination").value.trim();
  if (!amount_usdt || !destination) return toast("Fill in all fields");

  const res = await fetch(`${API_BASE}/api/withdraw`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ amount_usdt, method, destination })
  });
  if (!res.ok) return toast((await res.json()).detail || "Could not submit");
  toast("Withdrawal requested — pending review");
  document.getElementById("withdrawModal").classList.remove("show");
  await loadMe();
};

(async function init() {
  await loadAppSettings();
  await loadMe();
  await Promise.all([loadDaily(), loadSpinStatus(), loadTasks(), loadReferral()]);
})();
</script>
</body>
</html>
